name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / Qt ${{ matrix.qt_arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin this runner because windows-latest now uses the VS 2026 image.
          # The Qt kit and generator below require Visual Studio 2022.
          - os: windows-2022
            qt_arch: win64_msvc2022_64
          - os: ubuntu-latest
            qt_arch: linux_gcc_64
          - os: macos-latest
            qt_arch: clang_64

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # Qt 6.8.3 links the removed macOS AGL framework. Qt 6.10 supports
          # the current macOS SDKs used by GitHub-hosted arm64 runners.
          version: '6.10.3'
          target: desktop
          arch: ${{ matrix.qt_arch }}
          install-deps: true

      - name: Verify Windows Qt toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Qt root: $env:QT_ROOT_DIR"
          $qtConfig = Join-Path $env:QT_ROOT_DIR 'lib/cmake/Qt6/Qt6Config.cmake'
          if (-not (Test-Path -LiteralPath $qtConfig)) {
              throw "Qt6Config.cmake was not found at $qtConfig"
          }
          cmake --version

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python sources
        shell: bash
        run: |
          python -m py_compile src/qtgui_mcp_server.py scripts/setup_mcp.py scripts/package_release.py tests/test_setup_mcp.py tests/test_qtgui_mcp_server.py
          python -m unittest tests/test_setup_mcp.py tests/test_qtgui_mcp_server.py -v

      - name: Configure CMake
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON

      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Run Qt tests
        run: ctest --test-dir build -C Debug --output-on-failure
