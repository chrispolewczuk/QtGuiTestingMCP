name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / Qt ${{ matrix.qt_arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            qt_arch: win64_msvc2022_64
          - os: ubuntu-latest
            qt_arch: linux_gcc_64
          - os: macos-latest
            qt_arch: clang_64

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: desktop
          arch: ${{ matrix.qt_arch }}
          install-deps: true

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python sources
        shell: bash
        run: |
          python -m py_compile src/qtgui_mcp_server.py scripts/setup_mcp.py scripts/package_release.py tests/test_setup_mcp.py tests/test_qtgui_mcp_server.py
          python -m unittest tests/test_setup_mcp.py tests/test_qtgui_mcp_server.py -v

      - name: Configure CMake
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run Qt tests
        run: ctest --test-dir build --output-on-failure
